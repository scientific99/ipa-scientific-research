services:
  backend:
    build:
      context: ./translate_ipa
    image: ipa-be:latest
    ports:
      - "9000:9000"
    networks:
      - ipa-network

  frontend:
    build:
      context: ./ui
    image: ipa-fe:latest
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ipa-network

networks:
  ipa-network:
    driver: bridge
